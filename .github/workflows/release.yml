name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Tag must match appinfo.json version
        run: |
          v=$(python -c "import json;print(json.load(open('app/appinfo.json'))['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != appinfo v$v"; exit 1; }
      - name: Build ipk
        run: |
          python scripts/build.py
          python scripts/make_manifest.py
      - name: Attach ipk to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.ipk dist/*.manifest.json --clobber
