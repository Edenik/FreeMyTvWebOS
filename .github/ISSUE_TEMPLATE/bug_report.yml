name: Bug report
description: Something doesn't work on your TV
labels: [bug]
body:
  - type: input
    id: tv
    attributes:
      label: TV model and webOS version
      description: "Settings → General → About This TV (e.g. 55NANO81SNA, webOS 5.6.2)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Free My TV version
      description: "e.g. 1.4.0 (shown in the bottom-left of Customize)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it fail?
      options: [Install (install.py / Dev Manager), App won't start or blank screen, Shelf / launching apps, Weather, Trending picks, Settings / language, Performance, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output or console log
      description: "Installer output, or the on-TV/Web Inspector console if you have it. Remove passphrases and keys."
      render: shell
